[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html

# Custom markers for categorizing tests
markers =
    slow: tests that take >5 seconds to run
    integration: end-to-end tests requiring DB and full pipeline
    unit: pure unit tests with no external dependencies
    edge_case: edge case and boundary condition tests
    regression: regression tests based on production data

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning